# What miners and the validator must agree on. Read by common.config.chain_spec().

[genesis]
repo = "dendriteholdings/Ingot-genesis-27B-FP8"
revision = "d4f9316b9b7540670c329e9a98868586d5db3ae3"
# model_validation/families/<family> pins the architecture and the genesis safetensors size
family = "qwen38_27b"
quant = "fp8"

[teacher]
repo = "Qwen/Qwen3.8-27B"
revision = "main"

[dataset]
# Hugging Face Parquet dataset and split. Empty repo = the local JSONL at INGOT_DATASET_PATH.
repo = "dendriteholdings/ingot_corpus"
revision = "main"
split = "chungus"

[private_store]
chain_generation = "ingot-mainnet-2"
mailbox_url = "https://pub-e6aba013d13549e5a737273de761280f.r2.dev"

[upload_limits]
# The family.quantization pairs a miner may declare in r2activate, each with the largest upload
# (bytes, all files) it allows. Genesis fp8 is 30.9 GB as a submission.
qwen38_27b.fp8 = 35_000_000_000

[king_names]
# What a crowned king of each pair is called after Ingot-<roman numeral>-; the HF repo carries
# the same name. Same pairs as [upload_limits].
qwen38_27b.fp8 = "27B-FP8"

[files]
# A submission is exactly config.json, model.safetensors.index.json and the top-level
# *.safetensors shards the index names (names free). Any other file rejects it.
required = ["config.json", "model.safetensors.index.json"]
# Not part of a submission: genesis files added when a king is published to Hugging Face.
genesis = [
  "tokenizer.json",
  "tokenizer_config.json",
  "chat_template.jinja",
  "vocab.json",
  "merges.txt",
  "generation_config.json",
  "preprocessor_config.json",
  "video_preprocessor_config.json",
  "LICENSE",
]
