repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.87
    hooks:
      - id: ty
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: prettier --write
        language: node
        additional_dependencies: ["prettier@3.9.10"]
        language_version: "20.20.1"
        files: ^web/.*\.(js|css|json)$
        exclude: ^web/(data|brand)/
